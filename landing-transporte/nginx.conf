server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # Imágenes: caché larga
    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # HTML: siempre revalidar
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Ruta prevista del scope: /software-transporte
    location = /software-transporte { try_files /index.html =404; add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ /index.html; }
}
